# Local-cluster overlay for kind / minikube / Docker Desktop Kubernetes.
#
# This is NOT a standalone values file — it only overrides the keys that
# need to differ for a laptop cluster. Everything else (per-service image
# repos, JVM resource shapes, ingressPaths, etc.) is inherited from
# values-dev.yaml. Helm deep-merges nested maps across multiple -f files
# (last file wins per-key), so install with BOTH files, in this order:
#
#   helm upgrade --install catalogix ./helm/catalogix-hc \
#     -f helm/catalogix-hc/values-dev.yaml \
#     -f helm/catalogix-hc/values-local.yaml \
#     -n catalogix --create-namespace
#
# For Docker Desktop Kubernetes, global.imageRegistry stays empty. The image
# repositories below point directly at images already present in Docker's
# local image store.
#
# What this actually removes vs. values-dev.yaml + AWS:
#   - No RDS: templates/postgres-local.yaml spins up an in-cluster Postgres
#     instead (single shared role, database-per-service — same model as
#     local docker-compose; see that template's header comment).
#   - No AWS Secrets Manager / ESO: templates/local-secrets.yaml creates the
#     'catalogix-secrets' K8s Secret directly, generated on first install
#     and kept stable across `helm upgrade` (same pattern the chart already
#     uses for the RabbitMQ Erlang cookie).
#   - No ALB / WAF / TLS: ingress disabled entirely. gateway.service.type
#     below is LoadBalancer instead — Docker Desktop's Kubernetes binds that
#     straight to localhost with no port-forward process needed to keep
#     running. Open http://localhost:11000 — same port your local
#     docker-compose setup already uses, and now also what the gateway
#     container itself listens on (see gateway/nginx.conf's "listen 11000").
#   - No autoscaling: HPA off, every service pinned to 1 replica. This is
#     the main thing that makes footprint "fit" a laptop — 9 backend
#     backend services + gateway + frontend + rabbitmq + postgres at 2 replicas
#     each would ask for far more CPU/memory than most dev machines have
#     free alongside everything else running on it.
#   - No tracing backend: global.otlpEndpoint still points at a `monitoring`
#     namespace Tempo Service that won't exist unless you also install
#     helm/monitoring locally. This is harmless — the OTLP exporter just
#     logs connection-refused warnings in the background, it doesn't block
#     app startup — but worth knowing if you see those in the logs.

global:
  cloudProvider: "local"

database:
  host: "postgres-local"
  local:
    # Most local clusters ship a default StorageClass under one of these
    # names — kind and Docker Desktop Kubernetes both use "standard" by
    # default. Run `kubectl get storageclass` if installs get stuck
    # Pending on the PVC, and change this (or rabbitmq.storageClass below)
    # to whatever your cluster actually has.
    storageClass: "hostpath" # "standard" is the default for kind and "hostpath" is for Docker Desktop K8s
    storageSize: "1Gi"

rabbitmq:
  storageClass: "hostpath" # "standard" is the default for kind and "hostpath" is for Docker Desktop K8s
  storageSize: "1Gi"

ingress:
  enabled: false

hpa:
  # Disables HPA for all 9 backend services AND frontend — the
  # frontend-svc HPA block in templates/hpa.yaml is nested inside this same
  # top-level flag rather than having its own independent one like
  # gateway.hpa does below. Worth knowing if you ever want frontend
  # autoscaling on while the backend services' is off — today that's not
  # possible without editing the template, only this shared switch exists.
  enabled: false

backendServices:
  user-svc:
    replicaCount: 1
    # Full re-declaration, not just the password — Helm REPLACES (doesn't
    # merge) list values across -f files, so overriding just one entry's
    # value here would silently drop ALLOWED_ORIGINS/CORS_ALLOW_CREDENTIALS/
    # ADMIN_EMAILS/REFRESH_COOKIE_SECURE from values-dev.yaml's version of
    # this same list. Keep this in sync with values-dev.yaml's user-svc
    # extraEnv if that one ever changes. Only actual difference from it:
    # SEED_ADMIN_PASSWORD has a real fixed value here instead of requiring
    # --set, since this file never leaves your machine (see docker-compose.yaml's
    # matching comment on its own SEED_ADMIN_PASSWORD for the same reasoning).
    extraEnv:
      - name: ALLOWED_ORIGINS
        value: "*"
      - name: CORS_ALLOW_CREDENTIALS
        value: "true"
      - name: ADMIN_EMAILS
        value: "admin@example.com"
      - name: REFRESH_COOKIE_SECURE
        value: "false"
      - name: SEED_DATA
        value: "true"
      - name: SEED_ADMIN_EMAIL
        value: "admin@catalogix.local"
      - name: SEED_ADMIN_PASSWORD
        value: "Admin@12345"
    image:
      repository: "catalogix_user-svc"
      tag: "latest"
  
  catalog-svc: 
    replicaCount: 1
    image:
      repository: "catalogix_catalog-svc"
      tag: "latest"
  
  inventory-svc: 
    replicaCount: 1
    image:
      repository: "catalogix_inventory-svc"
      tag: "latest"
  
  cart-svc: 
    replicaCount: 1
    image:
      repository: "catalogix_cart-svc"
      tag: "latest"
  
  promotions-svc: 
    replicaCount: 1
    image:
      repository: "catalogix_promotions-svc"
      tag: "latest"
  
  payment-svc: 
    replicaCount: 1
    image:
      repository: "catalogix_payment-svc"
      tag: "latest"
  
  checkout-svc: 
    replicaCount: 1
    image:
      repository: "catalogix_checkout-svc"
      tag: "latest"
  
  notification-svc: 
    replicaCount: 1
    image:
      repository: "catalogix_notification-svc"
      tag: "latest"
  
  review-svc: 
    replicaCount: 1
    image:
      repository: "catalogix_review-svc"
      tag: "latest"

gateway:
  replicaCount: 1
  hpa:
    enabled: false
  image:
      repository: "catalogix_gateway"
      tag: "latest"
  service:
    # Docker Desktop's Kubernetes gives a Service of type LoadBalancer an
    # EXTERNAL-IP of "localhost" automatically and binds it on the host —
    # no `kubectl port-forward` process needs to stay running, and it
    # survives terminal closes/reboots of the process (the cluster itself
    # still needs to be up). Gateway now listens on 11000 natively (an
    # unprivileged port — see gateway.yaml's securityContext, which no
    # longer needs NET_BIND_SERVICE for this reason), so .service.port
    # from values-dev.yaml (11000) is exposed on localhost as-is; no
    # separate externalPort override needed.
    # NOTE: on kind/minikube this type doesn't bind to localhost the same
    # way — kind needs extraPortMappings set at cluster-creation time, and
    # minikube needs `minikube tunnel` running in the background to
    # populate an EXTERNAL-IP at all. Docker Desktop is the only one of
    # the three where this "just works" with zero extra setup.
    type: "LoadBalancer"

frontend:
  replicaCount: 1
  image:
      repository: "catalogix_frontend"
      tag: "latest"
