global:
  imageRegistry: ""
  imageTag: "1.0-0"
  cloudProvider: "aws"

database:
  host: "" # set at deploy time: --set database.host=<RDS endpoint from SSM>
  port: 5432
  # HikariCP pool size PER POD. Every pod of every service shares one small RDS
  # instance, so total connections = pods x pool. Dev budget (worst case, every
  # HPA at max): 6 services x 3 pods x 3 + checkout-svc 3 pods x 6 = 72 — under
  # the ~100 max_connections of a db.t4g.micro. Raise pool and instance class
  # together, never one alone.
  maxPoolSize: 3
  # No shared username here anymore — each service authenticates with its
  # own role (db_user_<svc>/db_password_<svc>, see
  # templates/_helpers.tpl's commonEnv), created by
  # terraform/platform-infra/modules/db-roles. The shared master role is used
  # only by Terraform's PostgreSQL provider to create and manage these roles.

# Per-service DB credentials, the JWT secret, RabbitMQ credentials and the
# bootstrap admin password are NOT stored here — they're pulled from AWS
# Secrets Manager by the ExternalSecret template (templates/external-secrets.yaml)
# into the 'catalogix-secrets' K8s Secret. The pipeline overrides this name with
# "<cluster name>/app-secrets" (see Jenkinsfile.app-cicd, 'Prepare Helm
# Arguments'); the value below is what a manual `helm install` would use.
secretsManager:
  appSecretName: "catalogix-cluster-dev/app-secrets"
  # Passwords the operator chose with `python bootstrap.py credentials` (RabbitMQ, the bootstrap
  # admin). Read directly by External Secrets — Terraform never sees them. Leave empty to fall
  # back to values in appSecretName (what staging still does).
  operatorSecretName: "catalogix-cluster-dev/operator-credentials"

rabbitmq:
  host: "rabbitmq" # in-cluster headless Service, see templates/rabbitmq.yaml
  port: 5672
  replicas: 1 # See templates/rabbitmq.yaml header comment: 3-replica clustering only gives real HA on >=3 nodes (each node hosting exactly 1 replica). On a small dev/minikube cluster, 3 replicas often just means multiple replicas stacked on the same node(s), which protects against a POD crashing but not a NODE dying — theater, not real HA. Bump this back to 3 once the node count actually supports it; the clustering code (RBAC, Erlang cookie, quorum queues) stays correct either way.
  image: "rabbitmq:4-management-alpine"
  storageClass: "gp3-sc"
  storageSize: "2Gi" # per-replica — StatefulSet volumeClaimTemplates provisions one PVC of this size PER pod, so 3 replicas = 3x 2Gi, not one shared 2Gi
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

ingress:
  enabled: true
  # Public DNS name and ACM certificate — both normally supplied by the pipeline
  # (INGRESS_HOST / TLS_CERT_ARN build parameters) and both empty here.
  # They are the SINGLE source for everything that depends on how the site is
  # reached: the ALB host rule, the HTTPS listener + HTTP->HTTPS redirect, the
  # app's public URL (links in emails) and the Secure flag of the refresh-token
  # cookie (see _helpers.tpl: catalogix.publicBaseUrl / catalogix.cookieSecure).
  # Nothing else needs to be flipped by hand when HTTPS is switched on.
  host: ""
  tlsCertArn: ""
  # Optional explicit override of the public URL, e.g. the raw ALB URL for an
  # HTTP-only environment with no DNS name.
  publicUrl: ""
  # Must be unique per AWS account + region; the pipeline sets catalogix-<env>-alb.
  loadBalancerName: "catalogix-dev-alb"

hpa:
  enabled: true

# One entry per backend service. Every field here is consumed generically by
# templates/backend-deployments.yaml, services.yaml, hpa.yaml, and pdb.yaml — adding
# adding another backend service only requires a new map entry.
backendServices:
  user-svc:
    dbName: catalogix-users
    usesRabbitMQ: true   # publishes user.email-verification-requested / user.password-reset-requested
    image: { repository: "catalogix-user-svc", pullPolicy: "IfNotPresent" }
    port: 11010
    # FRONTEND_BASE_URL and REFRESH_COOKIE_SECURE are derived from ingress.host /
    # ingress.tlsCertArn (see templates/_helpers.tpl) — never set them in extraEnv.
    publicUrlEnv: true
    replicaCount: 2
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    hpa:
      {
        minReplicas: 2,
        maxReplicas: 3,
        cpuUtilization: 75,
      }
    extraEnv:
      # The bootstrap admin: created on first start if NO admin exists yet, so a
      # fresh deployment always has one working login. Nobody can register as an
      # admin — every self-registered account is a customer, and only an existing
      # admin can grant the seller or admin role. The email is just an identifier;
      # the password is the one YOU chose with `python bootstrap.py credentials`
      # (key seed_admin_password in <cluster>/operator-credentials, synced by
      # External Secrets). The pipelines refuse to run when it is missing (stage
      # 'Verify Operator Credentials'), so a first deploy can't silently end up
      # with no admin. `optional: true` only keeps pod startup
      # alive if that check is bypassed (AdminSeeder then logs a loud ERROR).
      - name: SEED_ADMIN_EMAIL
        value: "admin@catalogix.local"
      - name: SEED_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: catalogix-secrets
            key: seed_admin_password
            optional: true

  catalog-svc:
    dbName: catalogix-catalog
    image: { repository: "catalogix-catalog-svc", pullPolicy: "IfNotPresent" }
    port: 11002
    replicaCount: 2
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    hpa:
      {
        minReplicas: 2,
        maxReplicas: 3,
        cpuUtilization: 75,
      }
    extraEnv:
      - name: INVENTORY_SVC_URL
        value: "http://inventory-svc:11003"
      - name: SEED_DATA
        value: "true"

  inventory-svc:
    dbName: catalogix-inventory
    image: { repository: "catalogix-inventory-svc", pullPolicy: "IfNotPresent" }
    port: 11003
    replicaCount: 2
    # Internal-only, service-to-service — no ALB path, mirrors the gateway's
    # nginx.conf rule in the local docker-compose setup.
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa:
      {
        minReplicas: 2,
        maxReplicas: 3,
        cpuUtilization: 75,
      }

  cart-svc:
    dbName: catalogix-cart
    image: { repository: "catalogix-cart-svc", pullPolicy: "IfNotPresent" }
    port: 11004
    replicaCount: 2
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa:
      {
        minReplicas: 2,
        maxReplicas: 3,
        cpuUtilization: 75,
      }
    extraEnv:
      - name: CATALOG_SVC_URL
        value: "http://catalog-svc:11002"
      - name: INVENTORY_SVC_URL
        value: "http://inventory-svc:11003"

  payment-svc:
    dbName: catalogix-payment
    image: { repository: "catalogix-payment-svc", pullPolicy: "IfNotPresent" }
    port: 11006
    replicaCount: 2
    # Internal-only — checkout-svc is its ONLY caller. No ALB path.
    # Pair with a NetworkPolicy restricting ingress to checkout-svc's pod
    # selector (see upgrade plan doc, section 7) once NetworkPolicies land.
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa:
      {
        minReplicas: 2,
        maxReplicas: 3,
        cpuUtilization: 75,
      }

  checkout-svc:
    dbName: catalogix-checkout
    usesRabbitMQ: true   # publishes order.confirmed / order.cancelled
    image: { repository: "catalogix-checkout-svc", pullPolicy: "IfNotPresent" }
    port: 11007
    # Each checkout holds its DB connection for the whole multi-service call
    # chain, so it needs a bigger pool than the other services.
    dbPoolSize: 6
    replicaCount: 2
    resources:
      requests: { cpu: "200m", memory: "320Mi" } # orchestrates 5 downstream calls per checkout — a bit more headroom
      limits: { cpu: "600m", memory: "640Mi" }
    hpa:
      {
        minReplicas: 2,
        maxReplicas: 3,
        cpuUtilization: 70,
      }
    extraEnv:
      - name: CATALOG_SVC_URL
        value: "http://catalog-svc:11002"
      - name: INVENTORY_SVC_URL
        value: "http://inventory-svc:11003"
      - name: PAYMENT_SVC_URL
        value: "http://payment-svc:11006"
      - name: CART_SVC_URL
        value: "http://cart-svc:11004"
      # AddressClient's @Value("${USER_SVC_URL}") has a localhost fallback
      # in application.properties, so this omission didn't crash the pod —
      # but without it, checkout-svc silently tries http://localhost:11010
      # in-cluster (itself, wrong port) instead of the real user-svc,
      # breaking address lookups during checkout at runtime.
      - name: USER_SVC_URL
        value: "http://user-svc:11010"

  notification-svc:
    dbName: catalogix-notification
    usesRabbitMQ: true
    image: { repository: "catalogix-notification-svc", pullPolicy: "IfNotPresent" }
    port: 11008
    replicaCount: 1
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "250m", memory: "384Mi" }
    routeToALB: true
    ingressPaths:
      - /notifications
    extraEnv:
      - name: MAIL_HOST
        value: "mailpit"
      - name: MAIL_PORT
        value: "1025"
      - name: MAIL_SMTP_AUTH
        value: "false"
      - name: MAIL_SMTP_STARTTLS
        value: "false"
      - name: MAIL_FROM
        value: "noreply@catalogix.local"
      - name: USER_SVC_URL
        value: "http://user-svc:11010"

gateway:
  image:
    repository: "catalogix-gateway"
    pullPolicy: "IfNotPresent"
  replicaCount: 2
  service:
    type: "ClusterIP"
    port: 11000
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 75


frontend:
  image:
    repository: "catalogix-frontend"
    pullPolicy: "IfNotPresent"
  replicaCount: 2
  service:
    type: "ClusterIP"
    port: 11001
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "256Mi" }
  hpa:
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 75
