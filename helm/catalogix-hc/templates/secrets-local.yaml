{{- if ne .Values.global.cloudProvider "aws" }}
# Local-cluster equivalent of external-secrets.yaml. Creates the exact same
# 'catalogix-secrets' Secret with the exact same keys, so every template
# that reads from it (see _helpers.tpl's commonEnv, and rabbitmq.yaml)
# works completely unchanged — they have no idea whether ESO or this
# template created the Secret.
#
# Simplification vs. the AWS path: Terraform's db-roles module gives every
# service its OWN Postgres role (db_user_<svc>/db_password_<svc>, distinct
# credentials, least-privilege). Reproducing that locally would mean this
# chart also running SQL (CREATE ROLE + GRANT) at install time — real, but
# more moving parts than local dev needs. Instead this mirrors
# docker-compose's model (see postgres-init/01-create-databases.sh's header
# comment): one shared Postgres role, isolation by database name only. The
# SAME shared username/password is written under every db_user_<svc> /
# db_password_<svc> key below, so commonEnv's per-service key lookups still
# resolve correctly — it just always resolves to the one shared credential.
#
# lookup + randAlphaNum, same pattern already used for the RabbitMQ Erlang
# cookie in rabbitmq.yaml: reuse existing values across `helm upgrade` so
# a redeploy doesn't rotate every credential out from under a running app
# (which would orphan the Postgres role's password and JWT-invalidate every
# live session). Only generates fresh values on first install.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "catalogix-secrets" }}
{{- $dbUser := "catalogix" }}
{{- $dbPass := "" }}
{{- $jwt := "" }}
{{- $rmqUser := "catalogix" }}
{{- $rmqPass := "" }}
{{- if $existing }}
{{- $dbPass = index $existing.data "db_password_user_svc" | b64dec }}
{{- $jwt = index $existing.data "jwt_secret" | b64dec }}
{{- $rmqPass = index $existing.data "rabbitmq_password" | b64dec }}
{{- else }}
{{- $dbPass = randAlphaNum 20 }}
{{- $jwt = randAlphaNum 48 }}
{{- $rmqPass = randAlphaNum 20 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: catalogix-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  jwt_secret: {{ $jwt | quote }}
  rabbitmq_user: {{ $rmqUser | quote }}
  rabbitmq_password: {{ $rmqPass | quote }}
  # One shared role, written under every service's expected key — see the
  # header comment above.
  {{- range $name, $svc := .Values.backendServices }}
  db_user_{{ $name | replace "-" "_" }}: {{ $dbUser | quote }}
  db_password_{{ $name | replace "-" "_" }}: {{ $dbPass | quote }}
  {{- end }}
  # Also exposed under the plain names postgres-local.yaml's init script
  # and the Postgres container itself use to create the role.
  local_db_user: {{ $dbUser | quote }}
  local_db_password: {{ $dbPass | quote }}
{{- end }}
