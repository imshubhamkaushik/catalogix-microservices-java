{{ if .Values.ingress.enabled }}
# Cloud edge: AWS ALB. Application edge: the in-cluster nginx gateway.
# Only the gateway is exposed by the ALB; it owns /api/* service routing and
# forwards all non-API traffic to the React frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalogix-gateway-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- /* ALB names are unique per AWS account + region. This used to be the fixed
           string "catalogix-alb", so a second environment in the same account
           (dev + staging share one) could never create its load balancer. The
           pipeline passes ingress.loadBalancerName=catalogix-<env>-alb; when it is
           unset the annotation is omitted and the controller generates a unique name. */}}
    {{- with .Values.ingress.loadBalancerName }}
    alb.ingress.kubernetes.io/load-balancer-name: {{ . }}
    {{- end }}
    alb.ingress.kubernetes.io/group.name: catalogix
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    {{ if .Values.ingress.tlsCertArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.tlsCertArn }}
    # Auto-adds an HTTP->HTTPS redirect action on the :80 listener so plain
    # http:// links still work instead of hanging/erroring.
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{ else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{ end }}
    alb.ingress.kubernetes.io/healthcheck-path: /gateway/health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
spec:
  ingressClassName: alb
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ .Values.gateway.service.port | int }}
{{ end }}
