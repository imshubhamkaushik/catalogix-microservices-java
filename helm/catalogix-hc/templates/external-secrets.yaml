{{- if eq .Values.global.cloudProvider "aws" }}
# ONE ExternalSecret owns the 'catalogix-secrets' K8s Secret.
#
# It used to be two — one "Owner" (DB master password) and one "Merge" (everything
# else) — both writing the same Secret. Two controllers reconciling one Secret with
# different ownership policies can overwrite each other's keys on every refresh, so
# a key could briefly vanish and pods starting in that window failed with
# CreateContainerConfigError. The DB master password (db_pass) was also being copied
# into the application namespace although no service uses it (each service has its
# own role: db_user_<svc>/db_password_<svc>). It is no longer synced at all.
#
# dataFrom.extract syncs EVERY key currently in the app Secrets Manager secret
# (jwt_secret, rabbitmq_*, seed_admin_password, db_user_<svc>/db_password_<svc> for
# all services) without listing each one — a new service's credentials (added in
# terraform/platform-infra/modules/db-roles) show up automatically. Key names are
# copied VERBATIM, lowercase; see _helpers.tpl's commonEnv.
#
# Rotation: pods read these values as environment variables at startup, so a
# rotated secret only reaches a pod when it restarts (e.g. `kubectl rollout restart`).
#
# Only rendered when global.cloudProvider is "aws" — requires the External Secrets
# Operator CRDs and a ClusterSecretStore named aws-secrets-manager (see
# terraform/platform-infra/modules/eso). For any other cloudProvider value (e.g.
# "local"), templates/secrets-local.yaml creates the same Secret directly.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalogix-app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: catalogix-secrets
    creationPolicy: Owner
  {{- if .Values.secretsManager.operatorSecretName }}
  # Credentials the OPERATOR chose (scripts/python/credentials.py). Listed explicitly — NOT
  # extracted wholesale — because the same secret also holds the RDS master password and the
  # Grafana login, which must never reach the application namespace. A key missing from the
  # secret makes this ExternalSecret fail to sync, so the pods wait instead of starting with
  # no RabbitMQ password or no admin.
  data:
    {{- range $key := list "rabbitmq_user" "rabbitmq_password" "seed_admin_password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.secretsManager.operatorSecretName }}
        property: {{ $key }}
    {{- end }}
  {{- end }}
  dataFrom:
    - extract:
        key: {{ .Values.secretsManager.appSecretName }}
{{- end }}
