# Two ExternalSecrets, both writing into the same 'catalogix-secrets' K8s
# Secret: one for the DB password (unchanged from the original chart), one
# for JWT_SECRET + RabbitMQ credentials (new — needed now that 9 services
# share one JWT signing key and talk to an in-cluster RabbitMQ).
# Both refresh hourly; ESO merges keys from multiple ExternalSecrets that
# target the same Secret name.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalogix-db-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: catalogix-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secretsManager.dbSecretName }}
        property: db_pass
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalogix-app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: catalogix-secrets
    creationPolicy: Merge   # merge into the same Secret the DB ExternalSecret owns, don't overwrite it
  # dataFrom.extract syncs EVERY key currently in this Secrets Manager
  # secret (jwt_secret, rabbitmq_*, and db_user_<svc>/db_password_<svc> for
  # all 9 services) without listing each one — a 10th service's credentials
  # (added in terraform/platform-infra/modules/db-roles) show up here
  # automatically, no template change needed. This replaced an earlier
  # explicit `data:` list (still the right choice when you want only
  # specific keys — not the case here, since every key in this secret is
  # meant to reach the cluster).
  dataFrom:
    - extract:
        key: {{ .Values.secretsManager.appSecretName }}
