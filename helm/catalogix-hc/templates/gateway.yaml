apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
spec:
  {{- if not (and .Values.gateway.hpa .Values.gateway.hpa.enabled) }}
  replicas: {{ .Values.gateway.replicaCount | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gateway
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port | default 11000 }}
          resources: {{ toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            # gateway/Dockerfile chowns this to UID 1000 at build time and
            # nginx writes proxy temp files here at runtime.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-log
              mountPath: /var/log/nginx
            # gateway/Dockerfile relocates the pid file to /tmp/nginx.pid
            # specifically because /var/run isn't guaranteed writable by a
            # non-root UID on this base image — this mount is what makes
            # that relocation actually work under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
          # Gateway listens on port 11000 (unprivileged, >1024) as non-root
          # UID 1000 — same as frontend's 11001, this needs no extra Linux
          # capability to bind. This used to listen on 80 and require
          # NET_BIND_SERVICE added back specifically for that; now that it's
          # on 11000, all capabilities can stay dropped, identical to
          # frontend.yaml's securityContext. (DEVOPS.md's "NET_BIND_SERVICE
          # on the gateway" section describes the old port-80 setup — update
          # that note if you ever move this port again.)
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Matches the Dockerfile's own HEALTHCHECK exactly (/gateway/health,
          # defined in gateway/nginx.conf) rather than '/' — '/' would proxy
          # to frontend per nginx.conf's routing and isn't a meaningful
          # gateway-liveness check on its own.
          readinessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
        # nginx-prometheus-exporter sidecar — scrapes the gateway's own
        # internal-only stub_status endpoint (nginx.conf's :8081 server
        # block, never exposed via the gateway Service) over localhost
        # (shared pod network namespace) and re-exposes it in Prometheus
        # format on :9113 for servicemonitors.yaml to scrape. Gives request
        # rate / active connections / dropped connections at the edge —
        # the one place in the request path with no metrics today, since
        # this is nginx, not a Spring Boot service with /actuator/prometheus.
        - name: nginx-exporter
          image: "nginx/nginx-prometheus-exporter:1.4.2"
          args:
            - "--nginx.scrape-uri=http://127.0.0.1:8081/stub_status"
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "32Mi" }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
spec:
  type: {{ .Values.gateway.service.type | default "ClusterIP" }}
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.port }}
    - name: metrics
      protocol: TCP
      port: 9113
      targetPort: 9113
