apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
spec:
  {{- if not (and .Values.gateway.hpa .Values.gateway.hpa.enabled) }}
  replicas: {{ .Values.gateway.replicaCount | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port | default 80 }}
          resources: {{ toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            # gateway/Dockerfile chowns this to UID 1000 at build time and
            # nginx writes proxy temp files here at runtime.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-log
              mountPath: /var/log/nginx
            # gateway/Dockerfile relocates the pid file to /tmp/nginx.pid
            # specifically because /var/run isn't guaranteed writable by a
            # non-root UID on this base image — this mount is what makes
            # that relocation actually work under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
          # Gateway listens on port 80 (a privileged port) as non-root UID
          # 1000 — unlike frontend-svc, which listens on 11000 and needs no
          # extra capability, gateway needs NET_BIND_SERVICE added back or
          # nginx can't bind the port at all and crash-loops. Documented in
          # DEVOPS.md's "NET_BIND_SERVICE on the gateway" section — copying
          # frontend.yaml's securityContext verbatim here would silently
          # break this, since frontend correctly needs no addition.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          # Matches the Dockerfile's own HEALTHCHECK exactly (/gateway/health,
          # defined in gateway/nginx.conf) rather than '/' — '/' would proxy
          # to frontend-svc per nginx.conf's routing and isn't a meaningful
          # gateway-liveness check on its own.
          readinessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
spec:
  type: {{ .Values.gateway.service.type | default "ClusterIP" }}
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.port }}
