{{- if ne .Values.global.cloudProvider "aws" }}
# Local-cluster stand-in for RDS. A single-replica, single-database-instance
# Postgres, database-per-service on one shared role — same model
# postgres-init/01-create-databases.sh uses for local docker-compose (see
# that file's header comment for the honest scope note on what this is and
# isn't). Not for staging/prod: no backups, no Multi-AZ, no per-service
# roles — purely so `helm install -f values-dev.yaml -f values-local.yaml`
# works on a laptop cluster (kind/minikube/Docker Desktop) with zero AWS
# dependency.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-local-init
  namespace: {{ .Release.Namespace }}
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -e

    for db in {{ range $name, $svc := .Values.backendServices }}{{ $svc.dbName }} {{ end }}; do
      psql \
        -v ON_ERROR_STOP=1 \
        --username "$POSTGRES_USER" \
        --dbname postgres <<-EOSQL
          SELECT format(
            'CREATE DATABASE %I OWNER %I',
            '$db',
            '$POSTGRES_USER'
          )
          WHERE NOT EXISTS (
            SELECT FROM pg_database WHERE datname = '$db'
          )\gexec
        EOSQL
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-local
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: postgres-local
  replicas: 1
  selector:
    matchLabels:
      app: postgres-local
  template:
    metadata:
      labels:
        app: postgres-local
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: "postgres:18-alpine"   # same image/version as docker-compose.yaml, for parity
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: local_db_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: local_db_password
            # Postgres requires SOME initial DB name at first boot. Never
            # used by any service — same reasoning as terraform's rds
            # module's catalogix_admin db_name, see env/dev/main.tf.
            - name: POSTGRES_DB
              value: "postgres"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          # No startupProbe previously existed here, so livenessProbe's own
          # initialDelaySeconds/periodSeconds/failureThreshold (a ~45s
          # budget) was the only thing standing between "first boot" and
          # "kubelet kills it". On a fresh, empty PGDATA that's often not
          # enough time for initdb + running every CREATE DATABASE
          # statement in 01-create-databases.sh (9 of them, each a
          # separate psql process) — especially on hostpath storage on a
          # laptop. If livenessProbe kills the container mid-bootstrap,
          # PGDATA is already on disk from the interrupted attempt, so
          # Postgres's entrypoint skips initdb AND skips
          # /docker-entrypoint-initdb.d on the restart — permanently. Every
          # backend service then crash-loops forever on "database does not
          # exist", and the only fix is manually creating the databases by
          # hand, since Postgres will never re-run the init scripts on its
          # own. A startupProbe with a generous budget (150s) makes sure
          # liveness/readiness don't even start evaluating until the
          # startup+init sequence has actually finished, exactly like the
          # startupProbe already used for every backend Spring Boot service
          # in _helpers.tpl's catalogix.probes.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: init-script
          configMap:
            name: postgres-local-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.database.local.storageClass }}
        storageClassName: {{ .Values.database.local.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.local.storageSize | default "1Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-local
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None   # headless — StatefulSet pod DNS, single pod so no discovery complexity needed
  selector:
    app: postgres-local
  ports:
    - port: 5432
{{- end }}
