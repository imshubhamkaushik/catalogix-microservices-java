apiVersion: v2
name: catalogix-monitoring
description: Monitoring stack for Catalogix
type: application
version: 0.1.0

dependencies:
  - name: kube-prometheus-stack
    version: "82.6.0"
    repository: https://prometheus-community.github.io/helm-charts
  # Logs — see helm/monitoring/values.yaml for the loki: / promtail: blocks.
  - name: loki
    version: "6.29.0"
    repository: https://grafana.github.io/helm-charts
  - name: promtail
    version: "6.16.6"
    repository: https://grafana.github.io/helm-charts
  # Traces (cluster only — local docker-compose dev keeps using Jaeger,
  # see the upgrade plan for why both exist rather than picking one everywhere).
  - name: tempo
    version: "1.10.1"
    repository: https://grafana.github.io/helm-charts
