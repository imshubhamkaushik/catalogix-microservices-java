# Alertmanager runs in the `monitoring` namespace, not `catalogix` — K8s
# Secrets are namespace-scoped, so this can't reuse the app chart's
# `catalogix-secrets` Secret even though the same ClusterSecretStore
# (cluster-scoped by design) can be referenced from here too.
#
# Pulls from terraform/platform-infra's module.alerting_secrets — a
# DEDICATED Secrets Manager entry, deliberately not the app's own
# app-secrets (JWT/RabbitMQ/DB creds have no reason to exist in the
# monitoring namespace at all).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.global.alertingSecretName }}
