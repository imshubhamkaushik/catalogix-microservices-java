apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogix-observability-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    # Same sidecar mechanism as catalogix-dashboard-cm.yaml, but for
    # datasources — Grafana's datasource sidecar watches this label.
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      # Service name hardcodes the "monitoring-" release prefix, matching
      # the same convention already used in templates/ingress.yaml.
      - name: Loki
        type: loki
        access: proxy
        url: http://monitoring-loki:3100
        uid: loki
