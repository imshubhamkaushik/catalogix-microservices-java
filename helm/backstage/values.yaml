# Deployed into the SAME namespace as the app (catalogix), not its own —
# same reasoning as other platform components: catalogix-secrets already carries
# db_user_backstage / db_password_backstage (see terraform/platform-infra's
# db_roles.services map), synced via the app chart's existing ExternalSecret.
# Zero new ExternalSecret/ClusterSecretStore plumbing needed for this chart.
namespace: catalogix

image:
  # This image is NOT pulled from a public registry — Backstage's own
  # Dockerfile (packages/backend/Dockerfile, generated by the real
  # @backstage/create-app scaffold) requires `yarn install`, `yarn tsc`,
  # and `yarn build:backend` to run on the HOST before `docker build`, to
  # produce packages/backend/dist/skeleton.tar.gz and bundle.tar.gz that
  # the Dockerfile packages. That build sequence needs to be a CI stage
  # (see the corresponding addition to Jenkinsfile.platform-infra) — this
  # chart assumes the image already exists in ECR by the time it deploys,
  # same as every other image in this project.
  repository: ""   # --set at deploy time: image.repository=<ECR registry>/backstage
  tag: "latest"
  pullPolicy: "IfNotPresent"

replicaCount: 1

port: 7007

database:
  host: ""   # --set at deploy time: database.host=<RDS endpoint from SSM>, same convention as helm/catalogix-hc and other platform components
  port: 5432
  name: "backstage"

resources:
  requests: { cpu: "200m", memory: "512Mi" }
  limits: { cpu: "1", memory: "1Gi" }

ingress:
  enabled: true
  path: "/portal"
