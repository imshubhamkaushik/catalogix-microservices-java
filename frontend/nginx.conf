server {
    listen 11001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Serve hashed build assets with long-term caching.
    # (Vite's default output dir is /assets/, not CRA's /static/.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is the one file that names the current
    # build's hashed asset files. A browser holding a stale copy after a deploy
    # requests assets from the previous build that no longer exist -> blank page.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Pass all other routes to React Router. These responses ARE index.html, so
    # they get the same no-cache treatment.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Optional: custom error page
    error_page 404 /index.html;
}
