plugins:
  - artifactId: docker-workflow

  # CORE
  - artifactId: configuration-as-code
  - artifactId: matrix-auth
  - artifactId: credentials
  - artifactId: credentials-binding

  # PIPELINES
  - artifactId: workflow-aggregator
  - artifactId: pipeline-graph-view

  # SCM
  - artifactId: git
  - artifactId: github
  # Needed for the 'lint-pr' multibranch job (jcasc.yaml) — PR discovery
  # traits (pullRequestDiscoveryTrait) and the github{} branch source type
  # both come from this plugin, not the plain 'github' one above (which
  # only provides githubPush() and commit-status notifications, no PR
  # discovery at all).
  - artifactId: github-branch-source
  - artifactId: workflow-multibranch

  # JOB DSL
  - artifactId: job-dsl

  # TOOLS
  - artifactId: nodejs
  - artifactId: maven-plugin

  # SONAR
  - artifactId: sonar

  # AWS
  - artifactId: aws-credentials

  # UTILS
  - artifactId: timestamper
  - artifactId: ws-cleanup
  - artifactId: dark-theme