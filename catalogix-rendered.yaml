apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list"]
---
# Source: catalogix-hc/templates/rabbitmq.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  namespace: default
subjects:
  - kind: ServiceAccount
    name: rabbitmq-sa
    namespace: default
roleRef:
  kind: Role
  name: rabbitmq-peer-discovery
  apiGroup: rbac.authorization.k8s.io
