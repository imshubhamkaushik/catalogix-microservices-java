# Source: catalogix-hc/templates/postgres-local.yaml
# Local-cluster stand-in for RDS. A single-replica, single-database-instance
# Postgres, database-per-service on one shared role — same model
# postgres-init/01-create-databases.sh uses for local docker-compose (see
# that file's header comment for the honest scope note on what this is and
# isn't). Not for staging/prod: no backups, no Multi-AZ, no per-service
# roles — purely so `helm install -f values-dev.yaml -f values-local.yaml`
# works on a laptop cluster (kind/minikube/Docker Desktop) with zero AWS
# dependency.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-local-init
  namespace: default
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -e
    for db in catalogix_cart catalogix_catalog catalogix_checkout catalogix_inventory catalogix_notification catalogix_payment catalogix_promotions catalogix_reviews catalogix_users ; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        SELECT 'CREATE DATABASE $db OWNER $POSTGRES_USER'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec
    EOSQL
    done
---
# Source: catalogix-hc/templates/rabbitmq.yaml
# ─── Cluster config — enables the peer discovery plugin + tells it how to find peers ───
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: default
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_peer_discovery_k8s,rabbitmq_prometheus].
  rabbitmq.conf: |
    cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
    cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type = hostname
    cluster_formation.k8s.service_name = rabbitmq
    cluster_formation.k8s.namespace = default
    cluster_formation.node_cleanup.interval = 30
    cluster_formation.node_cleanup.only_log_warning = true
    # pause_minority (not autoheal/ignore) — on a network partition, the
    # minority side stops accepting operations rather than risk two halves
    # of the cluster diverging. Safer default for a 3-node cluster than
    # letting both sides keep serving and reconcile later.
    cluster_partition_handling = pause_minority
    loopback_users.guest = false
---
