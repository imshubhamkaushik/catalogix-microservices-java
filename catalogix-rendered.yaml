# Source: catalogix-hc/templates/rabbitmq.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: default
spec:
  serviceName: rabbitmq
  replicas: 1
  podManagementPolicy: Parallel  # nodes need to come up together to cluster, not one-at-a-time like a typical StatefulSet rollout
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      serviceAccountName: rabbitmq-sa
      # Soft, not hard, anti-affinity: with a small node group (see
      # env/dev's node group sizing, 2/6/3), REQUIRING 3 distinct nodes
      # could leave a replica permanently Pending if the cluster is
      # temporarily scaled down. Preferred still steers the scheduler away
      # from stacking all 3 on one node under normal conditions.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: rabbitmq
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      # RabbitMQ requires its Erlang cookie file to be owned by the
      # rabbitmq user with strict 600 permissions. A Secret volume mount
      # can't express "root-owned file, then chown/chmod it" on its own —
      # this initContainer does that copy+chmod+chown once, as root,
      # before the main container (which runs as non-root 999) starts.
      # Same PVC is mounted in both, so the fix persists into the main container.
      initContainers:
        - name: erlang-cookie-setup
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              cp /secret-cookie/cookie /var/lib/rabbitmq/.erlang.cookie
              chmod 600 /var/lib/rabbitmq/.erlang.cookie
              chown 999:999 /var/lib/rabbitmq/.erlang.cookie
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: erlang-cookie-secret
              mountPath: /secret-cookie
              readOnly: true
      containers:
        - name: rabbitmq
          image: "rabbitmq:4-management-alpine"
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: clustering
              containerPort: 25672
            - name: epmd
              containerPort: 4369
            - name: metrics
              containerPort: 15692
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  # Lowercase — matches the AWS Secrets Manager JSON key
                  # exactly, since templates/external-secrets.yaml's
                  # app-secrets ExternalSecret uses dataFrom.extract, which
                  # copies keys verbatim (no renaming). Was RABBITMQ_USER
                  # (uppercase) here before — that stopped matching the
                  # moment external-secrets.yaml switched to dataFrom.extract
                  # and was never updated here. Same bug class already fixed
                  # once in _helpers.tpl's commonEnv, missed here until now.
                  key: rabbitmq_user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: rabbitmq_password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-erlang-cookie
                  key: cookie
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(POD_NAME).rabbitmq.default.svc.cluster.local"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources: 
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq
              readOnly: true
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: erlang-cookie-secret
          secret:
            secretName: rabbitmq-erlang-cookie
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
