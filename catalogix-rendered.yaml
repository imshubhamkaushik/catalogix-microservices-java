# Source: catalogix-hc/templates/gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: default
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gateway
          image: "/gateway:1.0-0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources: 
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            # gateway/Dockerfile chowns this to UID 1000 at build time and
            # nginx writes proxy temp files here at runtime.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-log
              mountPath: /var/log/nginx
            # gateway/Dockerfile relocates the pid file to /tmp/nginx.pid
            # specifically because /var/run isn't guaranteed writable by a
            # non-root UID on this base image — this mount is what makes
            # that relocation actually work under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
          # Gateway listens on port 80 (a privileged port) as non-root UID
          # 1000 — unlike frontend-svc, which listens on 11000 and needs no
          # extra capability, gateway needs NET_BIND_SERVICE added back or
          # nginx can't bind the port at all and crash-loops. Documented in
          # DEVOPS.md's "NET_BIND_SERVICE on the gateway" section — copying
          # frontend.yaml's securityContext verbatim here would silently
          # break this, since frontend correctly needs no addition.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          # Matches the Dockerfile's own HEALTHCHECK exactly (/gateway/health,
          # defined in gateway/nginx.conf) rather than '/' — '/' would proxy
          # to frontend-svc per nginx.conf's routing and isn't a meaningful
          # gateway-liveness check on its own.
          readinessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
        # nginx-prometheus-exporter sidecar — scrapes the gateway's own
        # internal-only stub_status endpoint (nginx.conf's :8081 server
        # block, never exposed via the gateway Service) over localhost
        # (shared pod network namespace) and re-exposes it in Prometheus
        # format on :9113 for servicemonitors.yaml to scrape. Gives request
        # rate / active connections / dropped connections at the edge —
        # the one place in the request path with no metrics today, since
        # this is nginx, not a Spring Boot service with /actuator/prometheus.
        - name: nginx-exporter
          image: "nginx/nginx-prometheus-exporter:1.4.2"
          args:
            - "--nginx.scrape-uri=http://127.0.0.1:8081/stub_status"
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "32Mi" }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
