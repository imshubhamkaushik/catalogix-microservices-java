apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-svc
  namespace: default
  labels:
    app: cart-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-svc
  template:
    metadata:
      labels:
        app: cart-svc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "11004"
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cart-svc
          image: "/cart-svc:1.0-0"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11004
          env:
            
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-local:5432/catalogix_cart"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: db_user_cart_svc
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: db_password_cart_svc
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: jwt_secret
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: rabbitmq_user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: rabbitmq_password
            - name: OTLP_ENDPOINT
              value: "http://monitoring-tempo.monitoring.svc.cluster.local:4318/v1/traces"   # Tempo's OTLP HTTP receiver, monitoring namespace
            - name: CATALOG_SVC_URL
              value: http://catalog-svc:11002
            - name: INVENTORY_SVC_URL
              value: http://inventory-svc:11003
            - name: PROMOTIONS_SVC_URL
              value: http://promotions-svc:11005
          resources: 
            limits:
              cpu: 400m
              memory: 384Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 11004
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 11004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 11004
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
