# Source: catalogix-hc/templates/rabbitmq.yaml
# Self-hosted RabbitMQ, clustered (3 replicas) for HA. See the upgrade
# plan's RabbitMQ hosting decision for why self-hosted over Amazon MQ.
#
# Three things had to be true simultaneously for this to be real HA, not
# just "more pods" — see the conversation this was built in for the full
# explanation:
#   1. Peer discovery (rabbitmq_peer_discovery_k8s plugin + RBAC below) so
#      the 3 pods can actually find and join each other.
#   2. A shared Erlang cookie (all 3 pods need the IDENTICAL cookie file,
#      or they refuse to cluster even if they can see each other).
#   3. Quorum queues at the APP level (backend/notification-svc/.../RabbitMQConfig.java
#      — QueueBuilder.durable(...).quorum()). Clustering the BROKER doesn't
#      make an individual QUEUE survive a node failure unless it's declared
#      quorum — this is the part that's easy to build infra for and still
#      not actually have HA.

# ─── RBAC — lets the peer-discovery plugin list pods/endpoints via the K8s API ───
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-sa
  namespace: default
---
# Source: catalogix-hc/templates/local-secrets.yaml
# Local-cluster equivalent of external-secrets.yaml. Creates the exact same
# 'catalogix-secrets' Secret with the exact same keys, so every template
# that reads from it (see _helpers.tpl's commonEnv, and rabbitmq.yaml)
# works completely unchanged — they have no idea whether ESO or this
# template created the Secret.
#
# Simplification vs. the AWS path: Terraform's db-roles module gives every
# service its OWN Postgres role (db_user_<svc>/db_password_<svc>, distinct
# credentials, least-privilege). Reproducing that locally would mean this
# chart also running SQL (CREATE ROLE + GRANT) at install time — real, but
# more moving parts than local dev needs. Instead this mirrors
# docker-compose's model (see postgres-init/01-create-databases.sh's header
# comment): one shared Postgres role, isolation by database name only. The
# SAME shared username/password is written under every db_user_<svc> /
# db_password_<svc> key below, so commonEnv's per-service key lookups still
# resolve correctly — it just always resolves to the one shared credential.
#
# lookup + randAlphaNum, same pattern already used for the RabbitMQ Erlang
# cookie in rabbitmq.yaml: reuse existing values across `helm upgrade` so
# a redeploy doesn't rotate every credential out from under a running app
# (which would orphan the Postgres role's password and JWT-invalidate every
# live session). Only generates fresh values on first install.
apiVersion: v1
kind: Secret
metadata:
  name: catalogix-secrets
  namespace: default
type: Opaque
stringData:
  jwt_secret: "lCNikgspeVPkwTAHWtmtQbqQFN5A9sKPtNsoX16XLxYNYTjc"
  rabbitmq_user: "catalogix"
  rabbitmq_password: "FWwlJu9XWuVar82dRGXF"
  # One shared role, written under every service's expected key — see the
  # header comment above.
  db_user_cart_svc: "catalogix"
  db_password_cart_svc: "Ukf0mRo6iUUTqTMXcOQE"
  db_user_catalog_svc: "catalogix"
  db_password_catalog_svc: "Ukf0mRo6iUUTqTMXcOQE"
  db_user_checkout_svc: "catalogix"
  db_password_checkout_svc: "Ukf0mRo6iUUTqTMXcOQE"
  db_user_inventory_svc: "catalogix"
