spring.application.name=checkout-svc
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway owns the schema (see src/main/resources/db/migration); Hibernate only validates
# that the entities match what Flyway created, it never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.sql.init.mode=never

# JWT_SECRET is read directly from the environment via @Value("${JWT_SECRET}") — must
# match every other service. checkout-svc is also the only service that MINTS
# tokens itself (system tokens, see JwtService.generateSystemToken), used by
# CompensationOutboxProcessor for background retries against inventory-svc/promotions-svc.

# Downstream services this orchestrator calls directly. All still plain HTTP
# (not events) for the same reason the original design used HTTP to
# product-svc: placing/paying for/cancelling an order needs an immediate
# yes/no, which isn't a great fit for async messaging without a bigger
# eventual-consistency rework than this system needs yet.
CATALOG_SVC_URL=${CATALOG_SVC_URL:http://localhost:8082}
INVENTORY_SVC_URL=${INVENTORY_SVC_URL:http://localhost:8085}
PROMOTIONS_SVC_URL=${PROMOTIONS_SVC_URL:http://localhost:8087}
PAYMENT_SVC_URL=${PAYMENT_SVC_URL:http://localhost:8088}
CART_SVC_URL=${CART_SVC_URL:http://localhost:8086}

# RabbitMQ: checkout-svc publishes order.confirmed/order.cancelled events
# here (see OrderEventPublisher) for notification-svc to consume.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# How often the outbox processor retries queued compensations (release stock
# / release a coupon use) that couldn't be delivered live. See
# CompensationOutboxProcessor.
OUTBOX_POLL_INTERVAL_MS=${OUTBOX_POLL_INTERVAL_MS:5000}

# Circuit breakers around the two synchronous, latency-sensitive calls on the
# order-placement hot path. Business outcomes (product not found /
# insufficient stock) are excluded from the failure count — see each
# client's Javadoc.
resilience4j.circuitbreaker.instances.catalogSvc.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalogSvc.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.catalogSvc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogSvc.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalogSvc.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalogSvc.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.catalogSvc.register-health-indicator=true
resilience4j.circuitbreaker.instances.catalogSvc.ignore-exceptions=com.catalogix.checkout.exception.ProductUnavailableException

resilience4j.circuitbreaker.instances.inventorySvc.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventorySvc.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventorySvc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventorySvc.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventorySvc.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventorySvc.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.inventorySvc.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventorySvc.ignore-exceptions=com.catalogix.checkout.exception.ProductUnavailableException

management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/actuator
management.server.port=8083
management.health.db.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s,5s
management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
