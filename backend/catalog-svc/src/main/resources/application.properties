spring.application.name=catalog-svc
server.port=11002

INVENTORY_SVC_URL=${INVENTORY_SVC_URL}
REVIEW_SVC_URL=${REVIEW_SVC_URL}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hikari tuning for the small local/EKS footprint. Keep pools bounded so a
# 9-service deployment does not create an unnecessary burst of DB connections
# and request threads. maxLifetime + keepalive also reduce stale pooled
# connections after an idle period or database-side connection recycling.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Flyway owns the schema (see src/main/resources/db/migration); Hibernate only validates
# that the entities match what Flyway created, it never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.sql.init.mode=never

# JWT_SECRET is read directly from the environment via @Value("${JWT_SECRET}") — must
# match the value configured for user-svc and order-svc. Declared here only as docs.

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/actuator
management.server.port=11002
management.health.db.enabled=true
# Enable histogram buckets
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Explicitly enable distribution statistics
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s,5s

management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

resilience4j.circuitbreaker.instances.inventorySvc.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventorySvc.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventorySvc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventorySvc.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventorySvc.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventorySvc.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.reviewSvc.sliding-window-size=10
resilience4j.circuitbreaker.instances.reviewSvc.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.reviewSvc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.reviewSvc.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.reviewSvc.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.reviewSvc.automatic-transition-from-open-to-half-open-enabled=true

management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

# Graceful shutdown: on SIGTERM stop accepting new requests but let in-flight ones finish
# (up to the timeout) before exiting. Pairs with the preStop sleep and
# terminationGracePeriodSeconds in helm/catalogix-hc — together they stop a rolling update
# from dropping requests.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
