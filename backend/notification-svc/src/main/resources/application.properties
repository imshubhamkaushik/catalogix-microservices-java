spring.application.name=notification-svc
server.port=11008

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hikari tuning for the small local/EKS footprint. Keep pools bounded so a
# 9-service deployment does not create an unnecessary burst of DB connections
# and request threads. maxLifetime + keepalive also reduce stale pooled
# connections after an idle period or database-side connection recycling.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Flyway owns the schema (see src/main/resources/db/migration); Hibernate only validates
# that the entities match what Flyway created, it never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.sql.init.mode=never

# JWT_SECRET is read directly from the environment via @Value("${JWT_SECRET}") — must
# match every other service. Declared here only as docs.

# In docker-compose this points at Mailpit (a dev-only SMTP catcher with a web
# UI at http://localhost:8025 — nothing is ever actually delivered anywhere).
# Point this at a real SMTP provider's settings for anything beyond local dev.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
MAIL_FROM=${MAIL_FROM:noreply@catalogix.local}

# For the SYSTEM-token lookup call to user-svc's
# GET /users/{id}/notification-preferences — see UserPreferenceClient.
# Same default-to-localhost pattern checkout-svc already uses for its own
# *_SVC_URL values.
USER_SVC_URL=${USER_SVC_URL:http://localhost:11010}

# RabbitMQ: consumes order.confirmed/order.cancelled (from order-svc) and
# user.email-verification-requested/user.password-reset-requested (from
# user-svc) — see RabbitMQConfig and the `listener` package. Replaces what
# used to be an inbound "send an email" HTTP endpoint.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Retry a failed listener invocation (e.g. a transient SMTP hiccup — see
# EmailSvc, which rethrows on failure specifically so this can kick in) 3
# times with exponential backoff before giving up. Once exhausted, the
# message is rejected without being requeued — since every queue is
# configured with a dead-letter-exchange (see RabbitMQConfig), it lands in
# catalogix.events.dlq instead of being retried forever or silently dropped.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/actuator
management.server.port=11008
management.health.db.enabled=true
management.health.mail.enabled=false

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s,5s
management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

# Graceful shutdown: on SIGTERM stop accepting new requests but let in-flight ones finish
# (up to the timeout) before exiting. Pairs with the preStop sleep and
# terminationGracePeriodSeconds in helm/catalogix-hc — together they stop a rolling update
# from dropping requests.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
