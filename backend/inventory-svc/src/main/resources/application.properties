spring.application.name=inventory-svc
server.port=11003

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hikari tuning for the small local/EKS footprint. Keep pools bounded so a
# 9-service deployment does not create an unnecessary burst of DB connections
# and request threads. maxLifetime + keepalive also reduce stale pooled
# connections after an idle period or database-side connection recycling.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

# Graceful shutdown: on SIGTERM stop accepting new requests but let in-flight ones finish
# (up to the timeout) before exiting. Pairs with the preStop sleep and
# terminationGracePeriodSeconds in helm/catalogix-hc — together they stop a rolling update
# from dropping requests.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
