spring.application.name=user-svc
server.port=11001

# Endpoints a caller reaches before they can possibly have a JWT yet (or, for
# /users/logout, is designed to work off the refresh cookie alone — see its
# @CookieValue-only signature in UserController). Every other endpoint in
# this service, and every endpoint in every other service, still requires a
# valid Bearer token — this list is additive to /health and /actuator*, not
# a replacement for the default deny-by-default behavior in JwtAuthFilter.
security.public-paths=/users/register,/users/login,/users/refresh,/users/logout,/users/verify-email,/users/forgot-password,/users/reset-password

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway owns the schema (see src/main/resources/db/migration); Hibernate only validates
# that the entities match what Flyway created, it never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.sql.init.mode=never

# Shared secret used to sign/verify JWTs. MUST be identical across every service,
# and at least 32 chars (HS256 = 256-bit key).
# (JWT_SECRET, JWT_EXPIRATION_MS, REFRESH_TOKEN_EXPIRATION_MS and ADMIN_EMAILS
# are read directly from the
# environment via @Value("${JWT_SECRET}") etc. — declared here only as docs.)

# RabbitMQ: user-svc publishes user.email-verification-requested and
# user.password-reset-requested events here (see UserEventPublisher) for
# notification-svc to consume — replaces what used to be a direct HTTP call.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Used to build the links inside verification/reset emails (must be reachable
# from a browser — point this at the gateway).
FRONTEND_BASE_URL=${FRONTEND_BASE_URL:http://localhost:11000}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
# In Spring Boot 3, endpoints are usually enabled by default. The new access property controls permission levels. read_only is the standard replacement for "enabled".
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=always

# The configuration hierarchy was reorganized to group properties by the monitoring system (Prometheus) rather than the function (metrics.export).
management.prometheus.metrics.export.enabled=true
management.server.port=11001
management.health.db.enabled=true

# Enable histogram buckets
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Explicitly enable distribution statistics
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s,5s

management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
