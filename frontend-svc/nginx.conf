server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve hashed build assets with long-term caching.
    # (Vite's default output dir is /assets/, not CRA's /static/.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pass all other routes to React Router
    location / {
        try_files $uri /index.html;
    }

    # Optional: custom error page
    error_page 404 /index.html;
}
