# =============================================================================
# SonarQube — unified analysis for all Catalogix code
# Scanned by the sonar-scanner-cli Docker image in Jenkinsfile.app-cicd.
# One project key, one dashboard, one quality gate for the whole monorepo.
# This root file is the ONLY Sonar config: the per-service
# backend/<svc>/sonar-project.properties files were never read by the pipeline
# and have been removed.
# =============================================================================

sonar.projectKey=catalogix
sonar.projectName=Catalogix — All Services
# Overridden per build by Jenkinsfile.app-cicd (-Dsonar.projectVersion=<IMAGE_TAG>)
# so SonarQube's "since previous version" new-code period actually advances.
sonar.projectVersion=2.0

sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# Sources: 9 backend services + the shared security-common module (JWT
# validation, rate limiting, CORS — the most security-critical code in the
# repo, previously not scanned at all) + the React frontend.
# -----------------------------------------------------------------------------
sonar.sources=\
    backend/security-common/src/main/java,\
    backend/user-svc/src/main/java,\
    backend/catalog-svc/src/main/java,\
    backend/inventory-svc/src/main/java,\
    backend/cart-svc/src/main/java,\
    backend/promotions-svc/src/main/java,\
    backend/payment-svc/src/main/java,\
    backend/checkout-svc/src/main/java,\
    backend/notification-svc/src/main/java,\
    backend/review-svc/src/main/java,\
    frontend/src

# Frontend tests live next to the code they test (frontend/src/**/*.test.jsx),
# so frontend/src is listed as both a source and a test root; the inclusion /
# exclusion patterns below decide which files are which.
sonar.tests=\
    backend/security-common/src/test/java,\
    backend/user-svc/src/test/java,\
    backend/catalog-svc/src/test/java,\
    backend/inventory-svc/src/test/java,\
    backend/cart-svc/src/test/java,\
    backend/promotions-svc/src/test/java,\
    backend/payment-svc/src/test/java,\
    backend/checkout-svc/src/test/java,\
    backend/notification-svc/src/test/java,\
    backend/review-svc/src/test/java,\
    frontend/src
sonar.test.inclusions=\
    backend/**/src/test/java/**/*.java,\
    frontend/src/**/*.test.js,\
    frontend/src/**/*.test.jsx,\
    frontend/src/setupTests.js

# -----------------------------------------------------------------------------
# Java bytecode (needed for accurate type resolution / dataflow). Wildcards:
# every module that was compiled this run is picked up automatically. The
# pipeline runs `mvn verify` for changed services and `mvn test-compile` for
# the rest, so all of them have classes by the time this scan runs.
# -----------------------------------------------------------------------------
sonar.java.binaries=backend/*/target/classes
sonar.java.test.binaries=backend/*/target/test-classes

# -----------------------------------------------------------------------------
# Coverage. JaCoCo reports come from `mvn verify`; the frontend lcov report
# from `npm run test:coverage`. Both are only produced for what was tested in
# THIS run, so coverage of untouched modules shows as missing rather than
# stale — gate on new-code coverage, not overall coverage.
# -----------------------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=backend/*/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Frontend
sonar.javascript.file.suffixes=.js,.jsx

sonar.exclusions=\
    frontend/build/**,\
    frontend/coverage/**,\
    frontend/node_modules/**,\
    frontend/src/**/*.test.js,\
    frontend/src/**/*.test.jsx,\
    frontend/src/setupTests.js,\
    **/target/**,\
    **/*.min.js
sonar.coverage.exclusions=frontend/src/main.jsx

# SCM data isn't available inside the scanner container
sonar.scm.disabled=true

# Exclude config files from copy-paste detection
sonar.cpd.exclusions=**/config/**
