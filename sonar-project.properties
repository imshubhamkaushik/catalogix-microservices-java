# =============================================================================
# SonarQube — Unified analysis for all Catalogix services
# Scanned by sonar-scanner-cli Docker image in Jenkinsfile.app-cicd.
# One project key, one dashboard, one quality gate for the whole monorepo.
# =============================================================================

# Project Identity
sonar.projectKey=catalogix
sonar.projectName=Catalogix — All Services
sonar.projectVersion=2.0

# Encoding
sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# Sources
# All 9 backend services + frontend defined here so the scanner covers the
# entire codebase in a single pass rather than N separate scans. Each service
# also carries its own sonar-project.properties (backend/<svc>/sonar-project.properties)
# for standalone/local scans — this root file is what Jenkinsfile.app-cicd's
# single whole-repo SonarQube stage actually uses.
# -----------------------------------------------------------------------------
sonar.sources=backend/user-svc/src/main/java,backend/catalog-svc/src/main/java,backend/inventory-svc/src/main/java,backend/cart-svc/src/main/java,backend/promotions-svc/src/main/java,backend/payment-svc/src/main/java,backend/checkout-svc/src/main/java,backend/notification-svc/src/main/java,backend/review-svc/src/main/java,frontend-svc/src

# -----------------------------------------------------------------------------
# Java bytecode — required for accurate Java analysis (type resolution,
# dataflow, etc.). Points at the compiled output from the Build Artifacts stage.
# -----------------------------------------------------------------------------
sonar.java.binaries=backend/user-svc/target/classes,backend/catalog-svc/target/classes,backend/inventory-svc/target/classes,backend/cart-svc/target/classes,backend/promotions-svc/target/classes,backend/payment-svc/target/classes,backend/checkout-svc/target/classes,backend/notification-svc/target/classes,backend/review-svc/target/classes

# -----------------------------------------------------------------------------
# Test sources + bytecode
# -----------------------------------------------------------------------------
sonar.tests=backend/user-svc/src/test/java,backend/catalog-svc/src/test/java,backend/inventory-svc/src/test/java,backend/cart-svc/src/test/java,backend/promotions-svc/src/test/java,backend/payment-svc/src/test/java,backend/checkout-svc/src/test/java,backend/notification-svc/src/test/java,backend/review-svc/src/test/java
sonar.java.test.binaries=backend/user-svc/target/test-classes,backend/catalog-svc/target/test-classes,backend/inventory-svc/target/test-classes,backend/cart-svc/target/test-classes,backend/promotions-svc/target/test-classes,backend/payment-svc/target/test-classes,backend/checkout-svc/target/test-classes,backend/notification-svc/target/test-classes,backend/review-svc/target/test-classes

# -----------------------------------------------------------------------------
# JaCoCo coverage reports — generated by mvn verify in the CI pipeline.
# -----------------------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=\
    backend/user-svc/target/site/jacoco/jacoco.xml,\
    backend/catalog-svc/target/site/jacoco/jacoco.xml,\
    backend/inventory-svc/target/site/jacoco/jacoco.xml,\
    backend/cart-svc/target/site/jacoco/jacoco.xml,\
    backend/promotions-svc/target/site/jacoco/jacoco.xml,\
    backend/payment-svc/target/site/jacoco/jacoco.xml,\
    backend/checkout-svc/target/site/jacoco/jacoco.xml,\
    backend/notification-svc/target/site/jacoco/jacoco.xml,\
    backend/review-svc/target/site/jacoco/jacoco.xml

# -----------------------------------------------------------------------------
# Frontend
# -----------------------------------------------------------------------------
sonar.javascript.file.suffixes=.js,.jsx

# Exclude build output, test resources, and generated files from analysis
sonar.exclusions=\
    frontend-svc/build/**,\
    frontend-svc/node_modules/**,\
    **/target/**,\
    **/*.min.js

# SCM info is not available inside the Docker container
sonar.scm.disabled=true

# Exclude config files from copy-paste detection
sonar.cpd.exclusions=**/config/**
