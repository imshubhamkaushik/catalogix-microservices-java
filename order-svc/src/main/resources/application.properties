spring.application.name=order-svc
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway owns the schema (see src/main/resources/db/migration); Hibernate only validates
# that the entities match what Flyway created, it never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.sql.init.mode=never

# JWT_SECRET is read directly from the environment via @Value("${JWT_SECRET}") — must
# match the value configured for user-svc and product-svc. Declared here only as docs.

# Base URL of product-svc, used to price items and reserve/restore stock when
# orders are placed/cancelled. In docker-compose this is the service DNS name;
# for local dev without compose, point it at localhost:8082. Still direct HTTP
# (not an event) — placing an order needs an immediate yes/no on stock, which
# isn't a great fit for async messaging without a bigger saga-style rework.
PRODUCT_SVC_URL=${PRODUCT_SVC_URL:http://localhost:8082}

# RabbitMQ: order-svc publishes order.confirmed/order.cancelled events here
# (see OrderEventPublisher) for notification-svc to consume — replaces what
# used to be a direct HTTP call to notification-svc.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# How often the outbox processor retries queued stock adjustments that
# couldn't be delivered live (see StockAdjustmentOutboxProcessor).
OUTBOX_POLL_INTERVAL_MS=${OUTBOX_POLL_INTERVAL_MS:30000}

# Circuit breaker around calls to product-svc (see ProductSvcClient). Opens
# after >=50% of the last 10 calls fail, stays open 10s, then allows 3 trial
# calls through before deciding whether to close again.
resilience4j.circuitbreaker.instances.productSvc.sliding-window-size=10
resilience4j.circuitbreaker.instances.productSvc.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productSvc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productSvc.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productSvc.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productSvc.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.productSvc.register-health-indicator=true
# Business outcomes (product not found / insufficient stock), not infrastructure
# failures — see ProductSvcClient's class-level Javadoc for the full reasoning.
resilience4j.circuitbreaker.instances.productSvc.ignore-exceptions=com.catalogix.order.exception.ProductUnavailableException

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/actuator
management.server.port=8083
management.health.db.enabled=true
# Enable histogram buckets
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Explicitly enable distribution statistics
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s,5s

management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
