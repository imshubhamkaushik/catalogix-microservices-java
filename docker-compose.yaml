# Every service below has an explicit mem_limit. Before this was added,
# NONE were set — and every Java service's Dockerfile sets
# -XX:MaxRAMPercentage=75, which computes 75% of whatever Docker reports
# as available. Without a container-level limit, that's 75% of your
# ENTIRE HOST RAM, independently, per service — with 7 backend JVMs running at
# once, that's a real, serious problem on a resource-constrained machine,
# not a minor inefficiency. Limits here match the Helm chart's own
# per-service resource limits (helm/catalogix-hc/values-dev.yaml) for
# consistency. Total ceiling across the app services: ~5.9GB — still
# substantial, so if you're tight on RAM, see the profiles below to run
# only a subset instead of everything at once.
# Every service also has an explicit `cpus:` limit, capping total demand
# across the app containers at exactly 4.0 cores. This isn't just "fair
# scheduling" — it's a root-cause fix for a real mechanism: Java 21's
# container-aware ergonomics size GC threads, JIT compiler threads, and
# other internal thread pools off Runtime.availableProcessors(), which
# WITHOUT a cgroup CPU quota returns the HOST's full core count. Every one
# of the 7 backend JVMs was independently sizing its background thread pools as if
# it alone owned all 6 host cores — which is exactly why CPU usage was high
# even on services with zero real traffic (frontend/gateway showed 0%
# while catalog-svc/inventory-svc sat at 74-87% idle).
# Setting `cpus:` gives each container a real cgroup quota, so the JVM
# correctly sizes its thread pools to a SMALLER number instead.
#
# Allocation preserves some of the Helm chart's relative weighting
# (user-svc/catalog-svc get slightly more, matching their higher Helm
# limits) but is otherwise simplified/flattened to fit a tight 4-core local
# budget — checkout-svc doesn't get proportionally more here the way it
# does in the Helm chart's 600m vs 400m, since there isn't room to
# preserve that at this total.
services:
  postgres:
    mem_limit: 512m
    cpus: 0.35
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_USER}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
      # Runs once, on first init of an empty data volume, to create one
      # database per service — see the script for the isolation tradeoffs
      # this local/dev-tier setup does and doesn't give you.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [catalogix]

  # Message broker: checkout-svc/user-svc publish domain events here (order
  # confirmed/cancelled, verification/password-reset requested);
  rabbitmq:
    mem_limit: 512m
    cpus: 0.6
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "25672:15672" # management UI (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks: [catalogix]

  # Local SMTP catcher used by notification-svc — view sent mail at
  # http://localhost:8025. It starts with the application because notification
  # flows depend on an SMTP endpoint in the local environment.
  mailpit:
    mem_limit: 128m
    cpus: 0.1
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks: [catalogix]
    

  user-svc:
    mem_limit: 512m
    cpus: 0.325
    image: catalogix-user-svc:latest
    build:
      context: .
      dockerfile: backend/user-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix_users
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Local compose serves the app over plain HTTP (http://localhost:11000,
      # no TLS). A Secure-flagged cookie set over a non-HTTPS response is
      # silently dropped by the browser — see UserController's cookieSecure
      # Javadoc. Real deployments (behind the ALB's TLS) should NOT set this
      # and must keep the true default.
      #
      # NOTE: this exact fix was applied once before in this conversation,
      # to this exact file, then silently lost when a fresh zip was
      # re-uploaded and this session switched to working from that copy
      # instead — the re-uploaded zip simply predated this fix. Re-applying
      # it now while already in this block for the seed-data wiring below.
      # If register/login mysteriously "work but don't stay logged in"
      # again in the future, this line is the first thing to check exists.
      REFRESH_COOKIE_SECURE: "false"
      # See AdminSeeder's Javadoc: the bootstrap admin, created on first start if no admin
      # exists yet. Fixed local-only credentials — this file never leaves your machine.
      # (On AWS it is the password you chose with `python bootstrap.py credentials`.)
      SEED_ADMIN_EMAIL: admin@catalogix.local
      SEED_ADMIN_PASSWORD: AdminAdminAdmin
    expose:
      - "11010"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [catalogix]

  # Catalog owns product metadata — name, description, price, and category.
  # inventory-svc owns stock, so the local
  # API path (/products via the gateway) is unchanged.
  catalog-svc:
    mem_limit: 512m
    cpus: 0.325
    image: catalogix-catalog-svc:latest
    build:
      context: .
      dockerfile: backend/catalog-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix_catalog
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      INVENTORY_SVC_URL: http://inventory-svc:11003
      SEED_DATA: "true"
    expose:
      - "11002"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-svc:
        # Doesn't guarantee inventory-svc is actually ready to receive
        # requests yet (no real healthcheck on it — see the note further
        # down on why), only that its container has started. Reduces, but
        # doesn't eliminate, the race between ProductSeeder's startup-time
        # calls to InventoryClient.init() and inventory-svc's own JVM boot.
        # ProductSeeder itself is written to survive this race regardless
        # (catches and logs rather than failing catalog-svc's own startup)
        # — this depends_on entry just makes the race less likely to fire
        # on a normal `docker compose up`.
        condition: service_started
    networks: [catalogix]

  # "How many are left" — inventory state is persisted independently from
  # catalog product metadata.
  # Owns row-level locking for reserve/release; nothing else in the system
  # is allowed to touch stock counts except through this service.
  inventory-svc:
    mem_limit: 384m
    cpus: 0.275
    image: catalogix-inventory-svc:latest
    build:
      context: .
      dockerfile: backend/inventory-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix_inventory
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "11003"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [catalogix]

  # Server-side cart. Reads catalog-svc (price/name) and inventory-svc
  # (stock, display-only) live on every read; never reserves stock itself —
  # that only happens once, at checkout-svc, at the moment of actually
  # placing an order.
  cart-svc:
    mem_limit: 384m
    cpus: 0.275
    image: catalogix-cart-svc:latest
    build:
      context: .
      dockerfile: backend/cart-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix_cart
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SVC_URL: http://catalog-svc:11002
      INVENTORY_SVC_URL: http://inventory-svc:11003
    expose:
      - "11004"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [catalogix]

  # Mock payment processing — the one split in this whole migration that's
  # justified by more than scale: isolating "the code that ever sees a card"
  # is the same reasoning real PCI-scope isolation is built on, even though
  # nothing here talks to an actual card network. Not reachable through the
  # gateway; checkout-svc is its only caller.
  payment-svc:
    mem_limit: 384m
    cpus: 0.275
    image: catalogix-payment-svc:latest
    build:
      context: .
      dockerfile: backend/payment-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix_payment
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "11006"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [catalogix]

  # The checkout saga orchestrator owns order state and coordinates the
  # order_items and payment interactions that used to be handled differently.
  # here now lives in cart-svc/payment-svc, each reached over
  # HTTP with explicit compensation on failure — see CheckoutSvc's Javadoc.
  checkout-svc:
    mem_limit: 640m
    cpus: 0.25
    image: catalogix-checkout-svc:latest
    build:
      context: .
      dockerfile: backend/checkout-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix_checkout
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SVC_URL: http://catalog-svc:11002
      INVENTORY_SVC_URL: http://inventory-svc:11003
      PAYMENT_SVC_URL: http://payment-svc:11006
      CART_SVC_URL: http://cart-svc:11004
      USER_SVC_URL: http://user-svc:11010
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    expose:
      - "11007"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # None of these have container healthchecks (distroless, no shell — see
      # note further down), so this only sequences container *start*, not
      # readiness. Calls made before a dependency has finished warming up
      # fail fast (circuit-breaker-guarded on checkout-svc's side) and the
      # client can retry, same as any other transient inter-service hiccup.
      catalog-svc:
        condition: service_started
      inventory-svc:
        condition: service_started
      payment-svc:
        condition: service_started
      cart-svc:
        condition: service_started
      user-svc:
        condition: service_started
    networks: [catalogix]

  # frontend and gateway both run on nginx:alpine (real HEALTHCHECK, has
  # wget) — every Java service above is distroless with no shell, so a
  # container-level healthcheck isn't practical for them; they rely on
  # depends_on + restart: unless-stopped instead.

  notification-svc:
    mem_limit: 384m
    cpus: 0.25
    image: catalogix-notification-svc:latest
    build:
      context: .
      dockerfile: backend/notification-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix_notification
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-noreply@catalogix.local}
      USER_SVC_URL: http://user-svc:11010
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    expose:
      - "11008"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      user-svc:
        condition: service_started
    networks: [catalogix]

  frontend:
    # Internal service port; only gateway publishes host port 11000.
    mem_limit: 256m
    cpus: 0.1
    image: catalogix-frontend:latest
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "11001"
    networks: [catalogix]

  gateway:
    # Sole browser-facing host endpoint: localhost:11000 -> gateway:11000.
    mem_limit: 128m
    cpus: 0.1
    image: catalogix-gateway:latest
    build:
      context: ./gateway
    restart: unless-stopped
    ports:
      - "11000:11000"
    depends_on:
      user-svc:
        condition: service_started
      catalog-svc:
        condition: service_started
      checkout-svc:
        condition: service_started
      cart-svc:
        condition: service_started
      frontend:
        condition: service_healthy
    networks: [catalogix]

networks:
  catalogix:
    driver: bridge

volumes:
  postgres_data:

secrets:
  # File-based secret for Postgres's own bootstrap. App services still
  # connect using SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD} from .env —
  # keep that value identical to this file's contents. In a real deployment
  # both would instead come from your platform's secrets manager (Vault,
  # AWS/GCP Secrets Manager, etc.); this local file is a stand-in for that.
  postgres_password:
    file: ./secrets/postgres_password.txt
