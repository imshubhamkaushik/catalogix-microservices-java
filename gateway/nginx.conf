# Catalogix API gateway — the single browser-facing entry point.
#
# External URL structure:
#   /api/users/*         -> user-svc
#   /api/products/*      -> catalog-svc
#   /api/cart/*          -> cart-svc
#   /api/wishlist/*      -> cart-svc
#   /api/orders/*        -> checkout-svc
#   /api/returns/*       -> checkout-svc
#   /api/admin/*         -> checkout-svc
#   /api/coupons/*       -> promotions-svc
#   /api/notifications  -> notification-svc
#   /api/reviews/*       -> review-svc
#   everything else      -> frontend-svc (React SPA)
#
# The /api prefix is deliberate: several React Router pages (/products,
# /orders, /users, /coupons, /reviews, etc.) use the same path names as the
# backend APIs. Without an API prefix, a browser refresh on one of those pages
# would be indistinguishable from an API request and the gateway could return
# JSON instead of the SPA shell. The frontend calls /api/*, so routing is now
# unambiguous and unknown /api/* paths get a real 404 instead of index.html.
#
# inventory-svc and payment-svc remain internal-only and have no gateway route.

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Authentication endpoints get their own stricter rate limit.
    location = /api/users/login {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11001;
    }

    location = /api/users/register {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11001;
    }

    location = /api/users/refresh {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11001;
    }

    # User APIs.
    location ~ ^/api/users(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11001;
    }

    # Catalog APIs.
    location ~ ^/api/products(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://catalog-svc:11002;
    }

    # Checkout/order APIs.
    location ~ ^/api/orders(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://checkout-svc:11007;
    }

    # Return APIs live in checkout-svc.
    location ~ ^/api/returns(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://checkout-svc:11007;
    }

    # Checkout outbox admin APIs.
    location ~ ^/api/admin(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://checkout-svc:11007;
    }

    # Cart APIs.
    location ~ ^/api/cart(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://cart-svc:11004;
    }

    # Wishlist lives inside cart-svc.
    location ~ ^/api/wishlist(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://cart-svc:11004;
    }

    # Admin coupon management. Internal promotions commit/preview/release
    # endpoints intentionally have no browser-facing gateway route.
    location ~ ^/api/coupons(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://promotions-svc:11005;
    }

    # Notification log is an admin-only read API.
    location ~ ^/api/notifications(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://notification-svc:11008;
    }

    # Review APIs.
    location ~ ^/api/reviews(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://review-svc:11009;
    }

    # Known API prefix with no matching backend route: do not accidentally
    # return index.html for an API typo.
    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    # Everything that is not /api/* is part of the React SPA. This also means
    # client-side routes such as /products, /orders, /users, /coupons and
    # /reviews continue to work on a hard browser refresh.
    location / {
        proxy_pass http://frontend-svc:11000;
    }
}
