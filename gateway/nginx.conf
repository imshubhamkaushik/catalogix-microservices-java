# API Gateway: the single entry point for the whole app (port 8080).
# Routes each service's own path prefix to that service, and everything
# else (the SPA + its static assets) to frontend-svc. Because the browser
# only ever talks to this one origin, CORS is a non-issue for compose users
# — it only matters for anyone hitting a backend service directly in dev.

# Defense-in-depth on top of each service's own app-level RateLimiterFilter
# (and, for login specifically, user-svc's LoginAttemptTracker): this throttles
# abusive traffic before it even reaches a backend container. Zone sizes (10m)
# hold roughly 160k tracked IPs each — plenty for a single-instance deployment.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Gateway's own liveness check (used by the compose healthcheck).
    location = /gateway/health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Tighter limit on login/register/refresh specifically — these are the
    # endpoints a credential-stuffing or account-enumeration attempt would hit.
    location = /users/login {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://user-svc:8081;
    }
    location = /users/register {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://user-svc:8081;
    }
    location = /users/refresh {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://user-svc:8081;
    }

    # No path segment after the upstream in proxy_pass => nginx forwards the
    # full matched URI as-is, e.g. /users/me -> http://user-svc:8081/users/me
    location /users {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://user-svc:8081;
    }

    location /products {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://product-svc:8082;
    }

    location /orders {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://order-svc:8083;
    }

    # Everything else: the React SPA and its static assets.
    location / {
        proxy_pass http://frontend-svc:80;
    }
}
