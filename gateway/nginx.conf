# Catalogix API gateway — the single browser-facing entry point.
#
# External URL structure:
#   /api/users/*         -> user-svc
#   /api/products/*      -> catalog-svc
#   /api/cart/*          -> cart-svc
#   /api/wishlist/*      -> cart-svc
#   /api/orders/*        -> checkout-svc
#   /api/returns/*       -> checkout-svc
#   /api/admin/*         -> checkout-svc
#   /api/coupons/*       -> promotions-svc
#   /api/notifications/* -> notification-svc
#   /api/reviews/*       -> review-svc
#   everything else      -> frontend (React SPA)
#
# inventory-svc and payment-svc remain internal-only.

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_status 429;

server {
    listen 11000;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Authentication endpoints
    location = /api/users/login {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11010;
    }

    location = /api/users/register {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11010;
    }

    location = /api/users/refresh {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11010;
    }

    # User APIs.
    location ~ ^/api/users(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11010;
    }

    # Catalog APIs.
    location ~ ^/api/products(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://catalog-svc:11002;
    }

    # Checkout/order APIs.
    location ~ ^/api/orders(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://checkout-svc:11007;
    }

    # Return APIs live in checkout-svc.
    location ~ ^/api/returns(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://checkout-svc:11007;
    }

    # Checkout outbox admin APIs.
    location ~ ^/api/admin(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://checkout-svc:11007;
    }

    # Cart APIs.
    location ~ ^/api/cart(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://cart-svc:11004;
    }

    # Wishlist lives inside cart-svc.
    location ~ ^/api/wishlist(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://cart-svc:11004;
    }

    # Admin coupon management. Internal promotions commit/preview/release
    # endpoints intentionally have no browser-facing gateway route.
    location ~ ^/api/coupons(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://promotions-svc:11005;
    }

    # Notification log is an admin-only read API.
    location ~ ^/api/notifications(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://notification-svc:11008;
    }

    # Review APIs
    location ~ ^/api/reviews(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://review-svc:11009;
    }

    # Unknown API paths
    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    # React SPA
    location / {
        proxy_pass http://frontend:11001;
    }
}

# Internal-only metrics endpoint for the nginx-prometheus-exporter sidecar
# (see helm/catalogix-hc/templates/gateway.yaml). Port 8081 is never exposed
# via the gateway Service — only reachable from inside the same pod, which
# is exactly how the exporter sidecar reaches it (shared pod network
# namespace, i.e. localhost). allow/deny is defense in depth on top of that
# in case this port is ever accidentally exposed later.
server {
    listen 8081;
    server_name _;

    access_log off;

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
