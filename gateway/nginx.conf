# Catalogix API gateway — the single browser-facing entry point.
#
# External URL structure:
#   /api/users/*         -> user-svc
#   /api/products/*      -> catalog-svc
#   /api/cart/*          -> cart-svc
#   /api/wishlist/*      -> cart-svc
#   /api/orders/*        -> checkout-svc
#   /api/returns/*       -> checkout-svc
#   /api/admin/*         -> checkout-svc
#   /api/coupons/*       -> promotions-svc
#   /api/notifications/* -> notification-svc
#   /api/reviews/*       -> review-svc
#   everything else      -> frontend (React SPA)
#
# inventory-svc and payment-svc remain internal-only.

# The scheme the CLIENT used. This nginx only ever sees plain HTTP from the ALB,
# so $scheme is always "http"; the ALB reports the real scheme in
# X-Forwarded-Proto. Passing $scheme on to the backends (as before) told them
# every request was insecure.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# HSTS only when the client really used HTTPS — sending it over HTTP is
# ignored by browsers and would be wrong to promise. An empty value makes
# add_header emit nothing.
map $forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_status 429;

server {
    listen 11000;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    # ── Security headers ─────────────────────────────────────────────────
    # Set once here so every response through the ALB carries them (no location
    # below defines its own add_header, so nothing overrides these).
    #  * script-src 'self': the built SPA loads only its own bundle — an
    #    injected <script> or inline handler will not run (mitigates XSS, and
    #    with it theft of the access token kept in localStorage).
    #  * style-src allows inline styles (React style props) and Google Fonts,
    #    which index.html loads; product images may come from any https host.
    #  * frame-ancestors 'none' + X-Frame-Options: no clickjacking.
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Authentication endpoints
    location = /api/users/login {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11010;
    }

    location = /api/users/register {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11010;
    }

    location = /api/users/refresh {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11010;
    }

    # User APIs.
    location ~ ^/api/users(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user-svc:11010;
    }

    # Catalog APIs.
    location ~ ^/api/products(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://catalog-svc:11002;
    }

    # Checkout/order APIs.
    location ~ ^/api/orders(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://checkout-svc:11007;
    }

    # Return APIs live in checkout-svc.
    location ~ ^/api/returns(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://checkout-svc:11007;
    }

    # Checkout outbox admin APIs.
    location ~ ^/api/admin(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://checkout-svc:11007;
    }

    # Cart APIs.
    location ~ ^/api/cart(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://cart-svc:11004;
    }

    # Wishlist lives inside cart-svc.
    location ~ ^/api/wishlist(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://cart-svc:11004;
    }

    # Admin coupon management. Internal promotions commit/preview/release
    # endpoints intentionally have no browser-facing gateway route.
    location ~ ^/api/coupons(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://promotions-svc:11005;
    }

    # Notification log is an admin-only read API.
    location ~ ^/api/notifications(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://notification-svc:11008;
    }

    # Review APIs
    location ~ ^/api/reviews(?:/|$) {
        limit_req zone=api_general burst=40 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://review-svc:11009;
    }

    # Unknown API paths
    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    # React SPA
    location / {
        proxy_pass http://frontend:11001;
    }
}

# Internal-only metrics endpoint for the nginx-prometheus-exporter sidecar
# (see helm/catalogix-hc/templates/gateway.yaml). Port 8081 is never exposed
# via the gateway Service — only reachable from inside the same pod, which
# is exactly how the exporter sidecar reaches it (shared pod network
# namespace, i.e. localhost). allow/deny is defense in depth on top of that
# in case this port is ever accidentally exposed later.
server {
    listen 8081;
    server_name _;

    access_log off;

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
