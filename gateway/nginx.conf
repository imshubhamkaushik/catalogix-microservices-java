# API Gateway: the single entry point for the whole app (port 8080).
# Routes each service's own path prefix to that service, and everything
# else (the SPA + its static assets) to frontend-svc. Because the browser
# only ever talks to this one origin, CORS is a non-issue for compose users
# — it only matters for anyone hitting a backend service directly in dev.
#
# Internal-only services (inventory-svc, promotions-svc's /promotions/*
# commit/preview/release endpoints, payment-svc) deliberately have NO route
# here — they're only ever called service-to-service, never by a browser.
# promotions-svc's /coupons/* admin-management endpoints ARE routed, since
# the admin UI calls those directly.

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # X-Real-IP is the one header downstream services should actually trust
    # for rate-limiting/client-IP purposes: it's set here, at the only hop
    # the client can't control, from nginx's own $remote_addr.
    proxy_set_header X-Real-IP $remote_addr;
    # Reset (not append) X-Forwarded-For: $proxy_add_x_forwarded_for appends
    # to whatever the client already sent, so a client could prepend an
    # arbitrary fake IP and have it survive as the first (leftmost) entry —
    # exactly the gap the original audit found letting a client spoof its
    # way past each service's own per-IP rate limiter. Every service's
    # RateLimiterFilter now prefers X-Real-IP first regardless (defense in
    # depth), but there's no reason to also hand out a forgeable XFF here.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /gateway/health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    location = /users/login {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://user-svc:8081;
    }
    location = /users/register {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://user-svc:8081;
    }
    location = /users/refresh {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://user-svc:8081;
    }

    location /users {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://user-svc:8081;
    }

    # catalog-svc (renamed from product-svc when stock ownership split off
    # to inventory-svc) — external path is unchanged, so the frontend needed
    # no changes for that split.
    location /products {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://catalog-svc:8082;
    }

    # checkout-svc (renamed from order-svc; now a saga orchestrator over
    # catalog-svc/inventory-svc/promotions-svc/payment-svc/cart-svc, none of
    # which the browser ever talks to directly except through here).
    location /orders {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://checkout-svc:8083;
    }

    # cart-svc — THIS ROUTE WAS MISSING ENTIRELY in the original gateway
    # config. Without it, every /cart/* call from the browser fell through
    # to the SPA catch-all below and silently got back index.html instead of
    # JSON — meaning the persistent cart (the core "browse -> add to cart ->
    # checkout" flow, not a side feature) was completely unreachable through
    # the documented single entry point. This is the fix.
    location /cart {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://cart-svc:8086;
    }

    # promotions-svc's admin-facing coupon management — same gap as /cart
    # had (also missing from the original config; the admin coupon page
    # called this and got the SPA shell back instead of JSON).
    location /coupons {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://promotions-svc:8087;
    }

    # Everything else: the React SPA and its static assets.
    location / {
        proxy_pass http://frontend-svc:80;
    }
}
